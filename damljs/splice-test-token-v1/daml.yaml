sdk-version: 3.4.11
name: splice-test-token-v1
source: daml
version: 1.0.0
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
  - ../../.localnet/dars/splice-api-token-metadata-v1-current.dar
  - ../../.localnet/dars/splice-api-token-holding-v1-current.dar
  - ../../.localnet/dars/splice-api-token-transfer-instruction-v1-current.dar
  - ../../.localnet/dars/splice-api-token-allocation-v1-current.dar
  - ../../.localnet/dars/splice-api-token-allocation-instruction-v1-current.dar
  - ../splice-token-standard-utils/.daml/dist/splice-token-standard-utils-2.0.0.dar

build-options:
  - --target=2.1
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
codegen:
  java:
    package-prefix: org.lfdecentralizedtrust.splice.codegen.java
    decoderClass: org.lfdecentralizedtrust.splice.codegen.java.DecoderSpliceTestTokenV1
    output-directory: target/daml-codegen-java
