name: Setup Playwright
description: 'Setup Playwright for jobs that consume build artifacts from the same workflow run'
runs:
    using: composite
    steps:
        - name: Get installed Playwright version
          id: playwright-version
          run: |
              # 'pnpm exec playwright --version' outputs e.g., "Version 1.58.2"
              # awk extracts just the number.
              version="$(pnpm exec playwright --version | awk '{print $2}')"
              echo "version=$version" >> "$GITHUB_OUTPUT"
          shell: bash

        - name: Load Playwright browser cache
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: playwright-cache
          with:
              path: '~/.cache/ms-playwright'
              key: '${{ runner.os }}-0-playwright-${{ steps.playwright-version.outputs.version }}'
              restore-keys: |
                  ${{ runner.os }}-0-playwright-

        - name: Install Playwright browsers
          run: |
              if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
                  pnpm exec playwright install chromium firefox
              else
                pnpm exec playwright install chromium firefox --with-deps
              fi
          shell: bash
