name: Setup pnpm (From Artifacts)
description: 'Setup pnpm for jobs that consume build artifacts from the same workflow run'
inputs:
    daml_release_version:
        description: 'Resolved DAML release version from workflow metadata job'
        required: true
runs:
    using: composite
    steps:
        - name: Install pnpm and Node.js
          uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
          with:
              node-version-file: .nvmrc
              cache: true

        - name: Download build artifacts
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
              name: build-dist-${{ github.run_id }}
