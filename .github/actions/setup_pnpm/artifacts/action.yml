name: Setup pnpm (From Artifacts)
description: 'Setup pnpm for jobs that consume build artifacts from the same workflow run'
inputs:
    daml_release_version:
        description: 'Resolved DAML release version from workflow metadata job'
        required: true
runs:
    using: composite
    steps:
        - name: Install pnpm and Node.js
          uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
          with:
              node-version-file: .nvmrc
              cache: true

        - name: Download build artifacts
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
              name: build-dist-${{ github.run_id }}

        # Nx names its cache DB after the machine id, so a DB built on another runner would be ignored.
        - name: Adopt Nx cache DB from build job
          shell: bash
          working-directory: .nx/workspace-data
          run: |
              id=$(cat /etc/machine-id)
              for db in *.db; do
                  if [[ -e $db && $db != "$id"-* ]]; then
                      mv "$db" "$id-${db##*-}"
                  fi
              done
