# A stand-alone token package for the "Token Composition" use-case in example 15.
#
# Key design constraint
# ─────────────────────
# This package has NO dependency on splice-test-token-v1 or on the trading-app DAR.
# It depends only on token standard API interfaces.  That is what makes it safe to
# vet on BOTH the global synchronizer AND the private app-synchronizer without
# pulling either:
#
#   • TokenRules (splice-test-token-v1) onto global-sync, or
#   • TradingApp (splice-token-test-trading-app-v2) onto app-sync.
#
# Vetting topology enforced by example 15:
#   splice-test-token-composition  → global + app-synchronizer  (this package)
#   splice-test-token-v1           → app-synchronizer ONLY
#   splice-token-test-trading-app-v2 → global ONLY
sdk-version: 3.4.11
name: splice-test-token-composition
version: 1.0.0
source: daml
dependencies:
    - daml-prim
    - daml-stdlib
data-dependencies:
    - ../../../../../../../.localnet/dars/splice-api-token-metadata-v1-1.0.0.dar
    - ../../../../../../../.localnet/dars/splice-api-token-holding-v1-1.0.0.dar
    - ../../../../../../../.localnet/dars/splice-api-token-allocation-v1-1.0.0.dar
    - ../../../../../../../.localnet/dars/splice-api-token-allocation-instruction-v1-1.0.0.dar
    - ../../../../../../../.localnet/dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
build-options:
    - --target=2.1
