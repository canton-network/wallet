enableScripts: true

npmMinimalAgeGate: 2880 # minimum age in minutes (48 hours)

npmRegistryServer: 'https://registry.npmjs.org'

packageExtensions:
    '@json-schema-tools/reference-resolver@*':
        dependencies:
            '@json-schema-tools/meta-schema': '*'
    '@open-rpc/generator@*':
        dependencies:
            '@inquirer/prompts': ^3.0.0
            '@open-rpc/schema-utils-js': ^2.0.2
    openapicmd@*:
        dependencies:
            lodash: '*'
            indent-string: ^4.0.0
            strip-ansi: '*'
            chalk: '*'
    typedoc@*:
        dependencies:
            typedoc-plugin-markdown: '*'
            typedoc-plugin-frontmatter: '*'
    typedoc-plugin-frontmatter@*:
        peerDependencies:
            typedoc: '*'
        dependencies:
            typedoc: '*'
            typedoc-plugin-markdown: '*'
    undici-types@*:
        dependencies:
            '@types/node': '*'
    vite-express@*:
        dependencies:
            vite: '*'
    vitest@*:
        dependencies:
            '@vitest/coverage-v8': '*'
